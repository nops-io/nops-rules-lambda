Description: Allow Essentials Lambda Function to use KMS to start EC2 with encrypted EBS

Parameters:
  lambdaExecutionRole:
    Description: The execution role name for Essentials Lambda. Please change it if you use different stack and role name.
    Type: String

Resources:
  KMSEBSAccessPolicy:
    Type: "AWS::IAM::ManagedPolicy"
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEssentialsLambdaToUseEncryptedEBS
            Effect: Allow
            Action:
              - "kms:RetireGrant"
              - "kms:CreateGrant"
              - "kms:ReEncrypt*"
              - "kms:GenerateDataKey*"
              - "kms:Encrypt"
              - "kms:DescribeKey"
              - "kms:Decrypt"
              - "kms:Encrypt"
            Resource:
              - "*"

      Roles:
        - !Ref "lambdaExecutionRole"
