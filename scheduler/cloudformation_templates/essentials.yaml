AWSTemplateFormatVersion: "2010-09-09"


Description:
  nOps - Essentials Lambda Functions


Parameters:
  Version:
    Description: Essentials Stack Version
    Type: String

  PreviousVersion:
    Description: Previous Essentials Stack Version for cleanup
    Type: String

  EventBridgeName:
    Description: The partner name of your Event Bridge in AWS.
    Default: nOps-Partner-EventBridge
    Type: String

  nOpsClientId:
    Description: nOps Client ID
    Type: String

  Environment:
    Description: Environment
    Default: prod
    Type: String


Resources:
  EssentialsLambdaZipBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'nops-essentials-lambda-zips-${AWS::AccountId}-${AWS::Region}-${Version}'
      Tags:
        - Key: createdby
          Value: nops
        - Key: nops-essentials-stack-version
          Value: !Ref Version

  EssentialsSetup:
    Type: Custom::EssentialsSetup
    Properties:
      ServiceToken: !GetAtt 'EssentialsSetupFunction.Arn'
      CreatedOn: "2024-05-13"
      DestBucket: !Ref EssentialsLambdaZipBucket
      SourceBucket: 'nops-rules-lambda-sources'
      PreviousVersion: !Ref PreviousVersion
      AccountId: !Ref 'AWS::AccountId'
      Region: !Ref 'AWS::Region'
      Environment: !Ref Environment
      ClientId: !Ref nOpsClientId
      EventBridgeName: !Ref EventBridgeName
      Object: !Sub 'essentials/essentials-lambda-codes-${Version}.zip'

  EssentialsSetupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Path: /
      Policies:
        - PolicyName: nops-essentials-lambda-stack-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - 'arn:aws:s3:::nops-rules-lambda-sources/*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:GetObjectTagging
                  - s3:PutObjectTagging
                Resource:
                  - !Sub 'arn:aws:s3:::${EssentialsLambdaZipBucket}/*'
              - Effect: Allow
                Action:
                  - events:DeleteRule
                  - events:DisableRule
                  - events:RemoveTargets
                Resource:
                  - !Sub 'arn:aws:events:*:${AWS::AccountId}:rule/aws.partner/nops.io/${AWS::AccountId}/*/nops-essentials-*'
              - Effect: Allow
                Action:
                  - cloudformation:DeleteStack
                Resource:
                  - !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:stack/nOps-essentials-v*/*'
              - Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/nOps-essentials-v*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/nops-essentials-eb-role-*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/nops-essentials-lambda-role-*'
              - Effect: Allow
                Action:
                  - lambda:DeleteFunction
                  - lambda:InvokeFunction
                  - lambda:RemovePermission
                Resource:
                  - !Sub 'arn:aws:lambda:*:${AWS::AccountId}:function:nOps-essentials-v*'
                  - !Sub 'arn:aws:lambda:*:${AWS::AccountId}:function:nops-essentials-lambda-${AWS::AccountId}-${AWS::Region}-v*'
              - Effect: Allow
                Action:
                  - s3:DeleteBucket
                Resource:
                  - !Sub 'arn:aws:s3:::nops-essentials-lambda-zips-${AWS::AccountId}-${AWS::Region}-*'

  EssentialsSetupFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: |
        Copies objects from a source S3 bucket to a destination.
        Removes old Essentials Stack.
      Handler: index.handler
      Runtime: python3.12
      Role: !GetAtt 'EssentialsSetupRole.Arn'
      Timeout: 120
      Code:
        ZipFile: |
          import json
          import logging
          import threading

          import botocore
          import boto3
          import cfnresponse

          def copy_objects(source_bucket, dest_bucket, zip_object):
              print(f'Copying {zip_object} from {source_bucket} to {dest_bucket}')
              s3 = boto3.client('s3')
              copy_source = {
                  'Bucket': source_bucket,
                  'Key': zip_object,
              }
              s3.copy_object(
                  CopySource=copy_source,
                  Bucket=dest_bucket,
                  Key=zip_object,
              )

          def delete_objects(bucket, zip_object):
              print(f'Deleting {zip_object} from {bucket}')
              s3 = boto3.client('s3')
              s3.delete_objects(
                  Bucket=bucket,
                  Delete={'Objects': [{'Key': zip_object}]},
              )

          def disable_previous_eventbridge_rule(properties):
              previous_version = properties['PreviousVersion']
              if not previous_version:
                  print('No previous version to disable')
                  return

              print(f'Disabling previous Essentials EventBridge Rule: {previous_version}')
              account_id = properties['AccountId']
              region = properties['Region']
              environment = properties['Environment']
              cliend_id = properties['ClientId']
              event_bridge_name = properties['EventBridgeName']

              events = boto3.client('events')
              try:
                  events.disable_rule(
                      Name=f'nops-essentials-{account_id}-{region}-{previous_version}',
                      EventBusName=f'aws.partner/nops.io/{account_id}/nops_{environment}_notification_{cliend_id}_{event_bridge_name}',
                  )
              except botocore.exceptions.ClientError as error:
                  print('Error disabling previous rule: %s' % error)

          def delete_previous_stack(previous_version):
              if not previous_version:
                  print('No previous version to delete')
                  return

              print(f'Deleting previous Essentials Stack: {previous_version}')
              cfn = boto3.client('cloudformation')
              cfn.delete_stack(StackName=f'nOps-essentials-{previous_version}')

          def timeout(event, context):
              logging.error('Execution is about to time out, sending failure response to CloudFormation')
              cfnresponse.send(event, context, cfnresponse.FAILED, {}, None)

          def handler(event, context):
              # make sure we send a failure to CloudFormation if the function
              # is going to timeout
              timer = threading.Timer(
                  (context.get_remaining_time_in_millis() / 1000.00) - 0.5,
                  timeout,
                  args=[event, context],
              )
              timer.start()

              print(f'Received event: {event}')

              properties = event['ResourceProperties']

              # Copy or delete zip object
              status = cfnresponse.SUCCESS
              try:
                  source_bucket = properties['SourceBucket']
                  dest_bucket = properties['DestBucket']
                  zip_object = properties['Object']
                  if event['RequestType'] == 'Delete':
                      delete_objects(dest_bucket, zip_object)
                  elif event['RequestType'] == 'Create':
                      copy_objects(source_bucket, dest_bucket, zip_object)
              except Exception as e:
                  logging.error('Exception: %s' % e, exc_info=True)
                  status = cfnresponse.FAILED

              # disable old rule and delete previous Essentials Stack
              try:
                  if event['RequestType'] == 'Create':
                      disable_previous_eventbridge_rule(properties)
                      delete_previous_stack(properties['PreviousVersion'])
              except Exception as e:
                  logging.error('Exception: %s' % e, exc_info=True)
                  status = cfnresponse.FAILED

              timer.cancel()
              data = {'CreatedOn': properties['CreatedOn']} 
              cfnresponse.send(event, context, status, data, None)

  EssentialsEventBridgeRule:
    Type: AWS::Events::Rule
    Properties:
      Description: !Sub nOps Essentials EventBridge Rule - ${AWS::StackName}
      EventBusName: !Sub 'aws.partner/nops.io/${AWS::AccountId}/nops_${Environment}_notification_${nOpsClientId}_${EventBridgeName}'
      Name: !Sub 'nops-essentials-${AWS::AccountId}-${AWS::Region}-${Version}'
      RoleArn: !Sub ${EssentialsEventBridgeRole.Arn}
      State: ENABLED
      Targets:
        - Arn: !Sub ${EssentialsLambdaFunction.Arn}
          Id: "nops-essentials-lambda-function"
      EventPattern: |
        {
          "detail": {
            "event_type": [
              "essentials__scheduler",
              "essentials__tag_resources",
              "essentials__storage",
              "essentials__rightsizing",
              "essentials__idle_resources"
            ]
          }
        }

  EssentialsEventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub nops-essentials-eb-role-${AWS::AccountId}-${AWS::Region}-${Version}
      Path: /
      AssumeRolePolicyDocument: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "events.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        }
      Policies:
        - PolicyName: nops-essentials-eventbridge-rules-role
          PolicyDocument: !Sub |
            {
              "Version": "2012-10-17",
              "Statement": [{
                "Effect": "Allow",
                "Action": [
                  "events:PutEvents"
                ],
                "Resource": [
                  "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/aws.partner/nops.io/${AWS::AccountId}/nops_${Environment}_notification_${nOpsClientId}_${EventBridgeName}"
                ]
              }]
            }

  EssentialsLambdaRole:
    Type: AWS::IAM::Role
    Description: |
      nOps Essentials Lambda Role with the following policy actions allowed:
        Scheduler:
          ASG:
            - autoscaling:CreateOrUpdateTags
            - autoscaling:UpdateAutoScalingGroup
          EC2:
            - ec2:CreateTags
            - ec2:StartInstances
            - ec2:StopInstances
          EKS nodegroup:
            - eks:DescribeNodegroup
            - eks:TagResource
          RDS:
            - rds:AddTagsToResource
            - rds:StartDBInstance
            - rds:StopDBInstance
          RDS cluster:
            - rds:AddTagsToResource
            - rds:StartDBCluster
            - rds:StopDBCluster
        Storage:
          GP3:
            EC2:
              - ec2:DescribeVolumes
              - ec2:ModifyVolume
            ASG:
              - autoscaling:DescribeAutoScalingGroups
              - autoscaling:StartInstanceRefresh
              - ec2:CreateLaunchTemplateVersion
              - ec2:DescribeLaunchTemplates
              - ec2:DescribeLaunchTemplateVersions
              - ec2:ModifyLaunchTemplate
        Rightsizing:
          EC2:
            - ec2:DescribeInstances
            - ec2:ModifyInstanceAttribute
            - ec2:StartInstances
            - ec2:StopInstances
        Idle:
          EC2:
            - ec2:StopInstances
            - ec2:TerminateInstances
          EBS:
            - ec2:CreateSnapshot
            - ec2:DeleteVolume
            - ec2:DescribeVolumes
    Properties:
      RoleName: !Sub nops-essentials-lambda-role-${AWS::AccountId}-${AWS::Region}-${Version}
      Path: /
      AssumeRolePolicyDocument: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        }
      Policies:
        - PolicyName: nops-essentials-lambda-policy
          PolicyDocument: |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "autoscaling:CreateOrUpdateTags",
                    "autoscaling:DescribeAutoScalingGroups",
                    "autoscaling:StartInstanceRefresh",
                    "autoscaling:UpdateAutoScalingGroup",
                    "ec2:CreateLaunchTemplateVersion",
                    "ec2:CreateSnapshot",
                    "ec2:CreateTags",
                    "ec2:DeleteVolume",
                    "ec2:DescribeInstances",
                    "ec2:DescribeVolumes",
                    "ec2:DescribeLaunchTemplates",
                    "ec2:DescribeLaunchTemplateVersions",
                    "ec2:ModifyInstanceAttribute",
                    "ec2:ModifyVolume",
                    "ec2:ModifyLaunchTemplate",
                    "ec2:RunInstances",
                    "ec2:StartInstances",
                    "ec2:StopInstances",
                    "ec2:TerminateInstances",
                    "eks:DescribeNodegroup",
                    "eks:TagResource",
                    "logs:CreateLogGroup",
                    "logs:CreateLogStream",
                    "logs:PutLogEvents",
                    "rds:AddTagsToResource",
                    "rds:DescribeDbInstances",
                    "rds:ModifyDBInstance",
                    "rds:StartDBCluster",
                    "rds:StartDBInstance",
                    "rds:StopDBCluster",
                    "rds:StopDBInstance"
                  ],
                  "Resource": "*"
                }
              ]
            }

  EssentialsLambdaFunction:
    Type: "AWS::Lambda::Function"
    DependsOn: EssentialsSetup
    Properties:
      FunctionName: !Sub nops-essentials-lambda-${AWS::AccountId}-${AWS::Region}-${Version}
      Description: !Sub nOps Essentials - Lambda Function - ${Version}
      Runtime: python3.12
      Handler: main.lambda_handler
      MemorySize: 128
      Timeout: 600
      Role: !GetAtt EssentialsLambdaRole.Arn
      Code:
        S3Bucket: !Ref EssentialsLambdaZipBucket
        S3Key: !Sub "essentials/essentials-lambda-codes-${Version}.zip"
      Tags:
        - Key: createdon
          Value: !GetAtt EssentialsSetup.CreatedOn
        - Key: nops-essentials-stack-version
          Value: !Ref Version

  EssentialsLambdaFunctionEventPermissions:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Sub ${EssentialsLambdaFunction.Arn}
      Principal: events.amazonaws.com
