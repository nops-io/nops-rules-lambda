Description:
  Allow Essentials Scheduler Lambda Function to use KMS for starting EC2s with encrypted EBS

Parameters:
    kmsArn:
        Description: The KMS ARN
        Type: String
    lambdaExecutionRole:
        Description: The execution role name for Essentials Scheduler Lambda. Please change it if you use different stack and role name.
        Type: String

Resources:
  KMSEBSAccessPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEssentialsSchedulerLambdaToUseEncryptedEBS 
            Effect: Allow
            Action:
              - 'kms:RetireGrant'
              - 'kms:CreateGrant'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:Encrypt'
              - 'kms:DescribeKey'
              - 'kms:Decrypt'
            Resource: !Ref 'kmsArn'
      Roles: 
        - !Ref 'lambdaExecutionRole' 
